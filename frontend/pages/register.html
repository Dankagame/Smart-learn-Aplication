<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription · SmartLearn</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-frame">

  <!-- Shared Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm py-2">
    <div class="container-xl">
      <a class="brand-logo-wrap" href="../index.html">
        <span class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </span>
        <span>SmartLearn <small class="text-muted fs-6 fw-normal">· Study smarter, even on low data.</small></span>
      </a>
      <div class="ms-auto d-flex gap-2">
        <a href="login.html" class="btn btn-outline-pill btn-sm">Se connecter</a>
        <a href="../index.html" class="btn btn-sm btn-outline-secondary rounded-pill">Accueil</a>
      </div>
    </div>
  </nav>

  <!-- Register Card -->
  <div class="auth-page">
    <div class="auth-card">
      
      <!-- Brand header -->
      <div class="text-center mb-4">
        <a href="../index.html" class="brand-logo-wrap justify-content-center mb-2">
          <span class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </span>
          <span>SmartLearn</span>
        </a>
        <h2 class="auth-title">Inscription</h2>
        <p class="text-muted small">Créez votre compte SmartLearn pour commencer à apprendre</p>
      </div>

      <!-- Feedback alert container -->
      <div id="authAlert" class="d-none"></div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>

        <!-- Role selection -->
        <div class="mb-3">
          <label for="roleSelect" class="form-label fw-semibold small text-muted">Je suis un(e)</label>
          <select class="form-select form-control-custom" id="roleSelect" required>
            <option value="student" selected>Élève (Student)</option>
            <option value="teacher">Enseignant (Teacher)</option>
          </select>
        </div>

        <!-- Full Name -->
        <div class="mb-3">
          <label for="fullName" class="form-label fw-semibold small text-muted">Nom complet</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-person-badge text-muted"></i>
            </span>
            <input 
              type="text" 
              class="form-control form-control-custom rounded-start-0" 
              id="fullName" 
              placeholder="ex: Fatoumata Ndiaye" 
              required
            >
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small text-muted">Adresse Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input 
              type="email" 
              class="form-control form-control-custom rounded-start-0" 
              id="email" 
              placeholder="ex: f.ndiaye@alustudent.com" 
              required
            >
          </div>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold small text-muted">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-at text-muted"></i>
            </span>
            <input 
              type="text" 
              class="form-control form-control-custom rounded-start-0" 
              id="username" 
              placeholder="ex: Fatoumata32" 
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold small text-muted">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-3">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input 
              type="password" 
              class="form-control form-control-custom rounded-start-0" 
              id="password" 
              placeholder="••••••••" 
              required
            >
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-auth-submit w-100 mt-2">
          Créer mon compte
        </button>

        <div class="text-center mt-4">
          <p class="text-muted small mb-1">
            Déjà inscrit(e) ? 
            <a href="login.html" class="fw-semibold text-decoration-none" style="color: var(--secondary-purple);">
              Se connecter
            </a>
          </p>
          <a href="../index.html" class="text-decoration-none small text-muted">
            <i class="bi bi-arrow-left me-1"></i>Retour à l'accueil
          </a>
        </div>

      </form>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
