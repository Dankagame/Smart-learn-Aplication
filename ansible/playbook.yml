---
- name: Harden the bastion host
  hosts: bastion
  become: true
  gather_facts: true

  roles:
    - role: common
      tags:
        - common
        - bastion
        - security
        - ssh
        - firewall

- name: Configure and deploy SmartLearn on the private app server
  hosts: webservers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify connectivity through the bastion
      ansible.builtin.ping:

    - name: Ensure target OS is supported (Debian/Ubuntu family)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "This playbook supports Debian/Ubuntu family Linux distributions."

  roles:
    - role: common
      tags:
        - common
        - security
        - ssh
        - firewall

    - role: docker
      tags:
        - docker

    - role: app
      tags:
        - app
        - deploy

  post_tasks:
    - name: Summary of deployment status
      ansible.builtin.debug:
        msg: >
          SmartLearn {{ image_tag }} is running on {{ inventory_hostname }} ({{ ansible_host }}).
          Public URL: {{ app_url }}
          Health check: {{ app_url }}/health
