---
# Default variables for app role
app_dir: "/opt/smartlearn"
app_user: "ubuntu"
app_group: "ubuntu"

backend_port: 8000
frontend_port: 80
db_port: 5432

docker_backend_image: "ghcr.io/dankagame/smartlearn-backend:latest"
docker_frontend_image: "ghcr.io/dankagame/smartlearn-frontend:latest"
docker_db_image: "postgres:16-alpine"

healthcheck_retries: 15
healthcheck_delay: 5
