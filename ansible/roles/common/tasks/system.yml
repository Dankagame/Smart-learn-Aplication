---
- name: Update apt cache if older than 1 hour
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade essential security packages (idempotent)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - ufw
      - git
      - htop
      - tar
      - unzip
    state: present

- name: Ensure UTC timezone
  community.general.timezone:
    name: Etc/UTC
  ignore_errors: true
