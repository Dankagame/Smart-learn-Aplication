---
# ==============================================================================
# Global Configuration Variables for SmartLearn Deployment
# ==============================================================================

# Application paths and system user
app_name: "SmartLearn"
app_dir: "/opt/smartlearn"
app_user: "ubuntu"
app_group: "ubuntu"

# Security & SSH Configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 4
ssh_x11_forwarding: "no"

# Firewall (UFW) allowed ports
firewall_allowed_tcp_ports:
  - 22    # SSH (management)
  - 80    # HTTP (Frontend web interface)
  - 443   # HTTPS (optional SSL termination)
  - 8000  # Backend API (FastAPI)

# Container Image specifications
docker_backend_image: "ghcr.io/dankagame/smartlearn-backend:latest"
docker_frontend_image: "ghcr.io/dankagame/smartlearn-frontend:latest"
docker_db_image: "postgres:16-alpine"

# Application Environment configuration
env_name: "production"
app_debug: "false"
backend_port: 8000
frontend_port: 80
db_port: 5432

# Database configuration
postgres_user: "smartlearn"
postgres_password: "change_me_in_production_password"
postgres_db: "smartlearn_db"

# JWT and Secret Keys
secret_key: "change_me_super_secret_jwt_key_smartlearn"
jwt_algorithm: "HS256"
access_token_expire_minutes: 60
cors_origins: "http://localhost,http://localhost:80,http://127.0.0.1"
