---
app_name: "SmartLearn"
app_dir: "/opt/smartlearn"
app_user: "ubuntu"
app_group: "ubuntu"

ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 4
ssh_x11_forwarding: "no"

firewall_allowed_tcp_ports:
  - 80

image_tag: "sha-d9448bf"
docker_backend_image: "ghcr.io/dankagame/smartlearn-backend:{{ image_tag }}"
docker_frontend_image: "ghcr.io/dankagame/smartlearn-frontend:{{ image_tag }}"
docker_db_image: "postgres:16-alpine"

env_name: "production"
app_debug: "false"
backend_port: 8000
frontend_port: 80
db_port: 5432

postgres_user: "smartlearn"
postgres_password: "{{ vault_postgres_password }}"
postgres_db: "smartlearn_db"

secret_key: "{{ vault_secret_key }}"
jwt_algorithm: "HS256"
access_token_expire_minutes: 60
cors_origins: "http://{{ ansible_host }}"
