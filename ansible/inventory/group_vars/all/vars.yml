---
app_name: "SmartLearn"
app_dir: "/opt/smartlearn"
app_user: "ubuntu"
app_group: "ubuntu"

ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 4
ssh_x11_forwarding: "no"
ssh_allowed_from: "10.0.0.0/16"

firewall_allowed_tcp_ports:
  - 80

aws_region: "us-east-1"
ecr_registry: "253490787868.dkr.ecr.us-east-1.amazonaws.com"
docker_backend_image: "{{ ecr_registry }}/smartlearn-backend:{{ image_tag }}"
docker_frontend_image: "{{ ecr_registry }}/smartlearn-frontend:{{ image_tag }}"
database_url_parameter: "/smartlearn/db/url"
app_log_group: "/smartlearn/app"
app_url: "http://smartlearn-alb-521972676.us-east-1.elb.amazonaws.com"

env_name: "production"
app_debug: "false"
backend_port: 8000
frontend_port: 80

secret_key: "{{ vault_secret_key }}"
jwt_algorithm: "HS256"
access_token_expire_minutes: 60
cors_origins: "{{ app_url }}"
