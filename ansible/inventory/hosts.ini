[bastion]
smartlearn-bastion ansible_host=3.94.215.33

[webservers]
smartlearn-app ansible_host=10.0.11.80

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/smartlearn-key
ansible_python_interpreter=/usr/bin/python3

[webservers:vars]
ansible_ssh_common_args=-o ProxyCommand="ssh -i {{ ansible_ssh_private_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -q {{ ansible_user }}@{{ hostvars[groups['bastion'][0]].ansible_host }}"
