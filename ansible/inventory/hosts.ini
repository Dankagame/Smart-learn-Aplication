# ==============================================================================
# SmartLearn Ansible Inventory
# ==============================================================================
# Update 'ansible_host' with the public IP provided by Terraform output or test VM.
# Update 'ansible_ssh_private_key_file' to point to your private SSH key.
# ==============================================================================

[webservers]
smartlearn-server ansible_host=YOUR_SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/smartlearn-key

[all:vars]
ansible_python_interpreter=/usr/bin/python3
