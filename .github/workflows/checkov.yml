name: Checkov

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/checkov.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/checkov.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_130,CKV_AWS_135,CKV_AWS_260,CKV2_AWS_5,CKV2_AWS_11,CKV2_AWS_41
