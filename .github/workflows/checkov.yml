name: Checkov

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/checkov.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/checkov.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Terraform scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: terraform/.checkov.yaml
          soft_fail: false
