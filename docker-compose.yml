services:
  db:
    image: postgres:16-alpine
    container_name: smartlearn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartlearn_user
      POSTGRES_PASSWORD: smartlearn_password
      POSTGRES_DB: smartlearn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlearn_user -d smartlearn_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartlearn-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlearn-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "SmartLearn API"
      ENVIRONMENT: "production"
      DEBUG: "false"
      DATABASE_URL: "postgresql+psycopg://smartlearn_user:smartlearn_password@db:5432/smartlearn_db"
      SECRET_KEY: "smartlearn-secret-key-for-dev-and-testing"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:80"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - smartlearn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartlearn-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5500:8080"
      - "80:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - smartlearn-network

volumes:
  postgres_data:

networks:
  smartlearn-network:
    driver: bridge
